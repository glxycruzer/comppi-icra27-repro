controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    controller_patience: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: comppi_controller::CoMPPIController
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.2
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 5.0
      simulate_ahead_time: 1.0
      batch_size: 1024
      time_steps: 32
      model_dt: 0.1
      iteration_count: 1
      lambda: 0.35
      noise_std_v: 0.2
      noise_std_w: 0.4
      noise_block_steps: 8
      retry_attempts: 2
      threads: 4
      vx_max: 0.4
      vx_min: 0.0
      wz_max: 1.0
      ax_max: 0.25
      ax_min: -1.0
      az_max: 3.0
      obstacle_weight: 10.0
      obstacle_critical_cost: 130.0
      path_align_weight: 12.0
      path_follow_weight: 6.0
      path_angle_weight: 2.0
      goal_weight: 6.0
      goal_angle_weight: 5.0
      prefer_forward_weight: 8.0
      twirling_weight: 0.6
      lookahead_dist: 0.0
      goal_dist_threshold: 0.8
      goal_angle_threshold: 0.5
      unknown_is_lethal: false
      use_odometry_velocity: true
      prune_distance: 2.5
      max_robot_pose_search_dist: 3.0
      transform_tolerance: 0.3
      visualize: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.19
      plugins:
      - static_layer
      - obstacle_layer
      - perception_replace_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        min_obstacle_height: -3.0
        max_obstacle_height: 10.0
        observation_sources: scan keepout_zones
        scan:
          topic: /scan
          min_obstacle_height: -3.0
          max_obstacle_height: 10.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 2.0
          raytrace_min_range: 0.17
          obstacle_max_range: 2.0
          obstacle_min_range: 0.17
          observation_persistence: 0.0
        keepout_zones:
          topic: /REDACTED_keepout/point_cloud
          sensor_frame: base_link
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          observation_persistence: 5.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      perception_replace_layer:
        plugin: REDACTED_internal/PerceptionLayer
        enabled: true
        topic: /REDACTED/perception_output
        transform_tolerance: 0.2
        timeout_sec: 0.5
        min_obstacle_height: -0.5
        max_obstacle_height: 2.0
        clear_on_timeout: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      unknown_cost_value: 255
      lethal_cost_threshold: 254
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /keepout_costmap_filter_info
        mask_topic: /keepout_filter_mask
