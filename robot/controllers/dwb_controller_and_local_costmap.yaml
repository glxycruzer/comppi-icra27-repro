controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    controller_patience: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.2
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 5.0
      simulate_ahead_time: 1.0
      debug_trajectory_details: true
      min_vel_x: 0.1
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.05
      max_speed_xy: 0.45
      min_speed_theta: 0.2
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.2
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.5
      PathAlign.scale: 64.0
      PathAlign.forward_point_distance: 0.3
      PathDist.scale: 16.0
      GoalAlign.scale: 10.0
      GoalAlign.forward_point_distance: 0.3
      GoalDist.scale: 10.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.19
      plugins:
      - static_layer
      - obstacle_layer
      - perception_replace_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        min_obstacle_height: -3.0
        max_obstacle_height: 10.0
        observation_sources: scan keepout_zones
        scan:
          topic: /scan
          min_obstacle_height: -3.0
          max_obstacle_height: 10.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 2.0
          raytrace_min_range: 0.17
          obstacle_max_range: 2.0
          obstacle_min_range: 0.17
          observation_persistence: 0.0
        keepout_zones:
          topic: /REDACTED_keepout/point_cloud
          sensor_frame: base_link
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          observation_persistence: 5.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      perception_replace_layer:
        plugin: REDACTED_internal/PerceptionLayer
        enabled: true
        topic: /REDACTED/perception_output
        transform_tolerance: 0.2
        timeout_sec: 0.5
        min_obstacle_height: -0.5
        max_obstacle_height: 2.0
        clear_on_timeout: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      unknown_cost_value: 255
      lethal_cost_threshold: 254
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /keepout_costmap_filter_info
        mask_topic: /keepout_filter_mask
